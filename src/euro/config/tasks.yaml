tasks:
  task1:
    description: "Move to plant zone and collect plants"
    dependencies: []
    sequence:
      - device: stm32
        command: move_forward
        params:
          distance: 200.0
          speed: 500.0
        wait: true
      - device: stm32
        command: rotate
        params:
          angle: 90
          is_radian: false
        wait: true
      - device: stm32
        command: move_forward
        params:
          distance: 200.0
          speed: 500.0
        wait: true

      